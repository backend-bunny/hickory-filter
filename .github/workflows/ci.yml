name: ci

on:
  pull_request:
  # Runs on main too: caches written there are visible to every pull request,
  # while caches written by a pull request are visible only to that one.
  push:
    branches: [main]
  workflow_dispatch:

# Read-only: pull request builds never publish, sign or get an OIDC token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conventional-commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The title goes through the environment, never into the script text.
      - env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: hack/check-commits.sh --title "$PR_TITLE" --range "$RANGE"

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: hack/check-policy.sh
      - run: python3 -I -m unittest discover -s hack

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - run: devbox run -- hack/cargo-check.sh
      - run: devbox run -- cargo deny check licenses

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - run: devbox run -- hack/chart-test.sh
      - run: DRY_RUN=1 devbox run -- hack/chart-publish.sh

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - run: devbox run -- hack/build.sh
      - run: devbox run -- hack/test.sh

  # The single required check: fails unless every other job succeeded.
  ci-ok:
    if: always()
    needs: [conventional-commits, policy, rust, chart, package]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
