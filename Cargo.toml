[package]
name = "hickory-filter"
version = "0.1.1"
edition = "2024"
rust-version = "1.96"
description = "A filtering DNS forwarder: allow/block rules, list formats and scheduled blocklist refresh"
license = "MIT OR Apache-2.0"
repository = "https://github.com/backend-bunny/hickory-filter"
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "time", "sync", "macros", "net", "signal"] }
arc-swap = "1.9.5"
async-trait = "0.1.92"
fst = "0.4.7"
hickory-resolver = { version = "=0.26.4", features = ["tokio", "tls-aws-lc-rs", "rustls-platform-verifier", "metrics"] }
hickory-server = { version = "=0.26.4", features = ["resolver", "recursor", "dnssec-aws-lc-rs", "toml"] }
humantime = "2.4.0"
regex = "1.13.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.3"
socket2 = { version = "0.6.5", features = ["all"] }
hyper = { version = "1.13.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "server-graceful", "http1"] }
http-body-util = "0.1.5"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "registry", "json"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
# A name server that speaks DNS-over-TLS with a self-signed certificate, for the
# opportunistic encryption tests. Dev-only: nothing here reaches the binary.
hickory-server = { version = "=0.26.4", features = ["tls-aws-lc-rs"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "test-util"] }

[[bench]]
name = "lookup"
harness = false
