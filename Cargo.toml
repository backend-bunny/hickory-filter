[package]
name = "hickory-filter"
version = "0.1.0"
edition = "2024"
description = "A filtering DNS forwarder: allow/block rules, list formats and scheduled blocklist refresh"
license = "MIT OR Apache-2.0"
repository = "https://github.com/backend-bunny/hickory-filter"
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
tokio = { version = "1.54.1", features = ["rt", "time", "sync", "macros"] }
arc-swap = "1.9.5"
async-trait = "0.1.92"
fst = "0.4.7"
hickory-resolver = { version = "=0.26.4", features = ["tokio", "tls-aws-lc-rs", "rustls-platform-verifier"] }
hickory-server = { version = "=0.26.4", features = ["resolver"] }
humantime = "2.4.0"
regex = "1.13.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.3"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "test-util"] }

[[bench]]
name = "lookup"
harness = false
