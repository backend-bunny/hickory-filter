[package]
name = "hickory-filter"
version = "0.1.0"
edition = "2024"
description = "A filtering DNS forwarder: allow/block rules, list formats and scheduled blocklist refresh"
license = "MIT OR Apache-2.0"
repository = "https://github.com/backend-bunny/hickory-filter"
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
arc-swap = "1.9.5"
async-trait = "0.1.92"
hickory-server = { version = "=0.26.4", features = ["resolver"] }
humantime = "2.4.0"
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.3"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time"] }
