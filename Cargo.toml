[package]
name = "hickory-filter"
version = "0.1.0"
edition = "2024"
description = "A filtering DNS forwarder: allow/block rules, list formats and scheduled blocklist refresh"
license = "MIT OR Apache-2.0"
repository = "https://github.com/backend-bunny/hickory-filter"
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
async-trait = "0.1.92"
hickory-server = { version = "=0.26.4", features = ["resolver"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time"] }
