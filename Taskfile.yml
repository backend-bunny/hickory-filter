# Local entry points. Every task calls a script in hack/, the same script CI
# runs, so there is one implementation of each step. Run through the pinned
# toolchain: `devbox run -- task <name>` (or with direnv loaded, `task <name>`).
version: "3"

tasks:
  default:
    desc: List tasks
    silent: true
    cmds:
      - task --list

  check:
    desc: cargo fmt --check, clippy -D warnings, cargo test
    cmds:
      - hack/cargo-check.sh

  build:
    desc: Build the APK and the image into out/ (melange + apko)
    cmds:
      - hack/build.sh

  test:
    desc: Smoke-test the built image
    cmds:
      - hack/test.sh

  lock:
    desc: Regenerate apko.lock.json (Wolfi packages only)
    cmds:
      - hack/lock.sh

  chart:test:
    desc: Lint the chart and validate its rendered manifests
    cmds:
      - hack/chart-test.sh

  publish:dry-run:
    desc: Print the image tags and package the chart without pushing
    env:
      DRY_RUN: "1"
    cmds:
      - hack/publish.sh
      - hack/chart-publish.sh
