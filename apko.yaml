# Runtime image: the static hickory-filter binary and the CA bundle on a
# distroless Wolfi layout. No shell, no libc, no package manager.
contents:
  repositories:
    - https://packages.wolfi.dev/os
    - '@local ./packages'
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - ca-certificates-bundle
    - hickory-filter@local

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/hickory-filter

paths:
  - path: /etc/hickory-filter
    type: directory
    permissions: 0o755
  - path: /tmp
    type: directory
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: hickory-filter
  org.opencontainers.image.description: A filtering DNS forwarder with allow/block rules and scheduled blocklist refresh.
  org.opencontainers.image.licenses: MIT OR Apache-2.0
  org.opencontainers.image.source: https://github.com/backend-bunny/hickory-filter
  org.opencontainers.image.url: https://github.com/backend-bunny/hickory-filter

archs:
  - x86_64
