{{- if .Values.dashboardConfigMap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hickory-filter.fullname" . }}-dashboard
  namespace: {{ default .Release.Namespace .Values.dashboardConfigMap.namespace }}
  labels:
    {{- include "hickory-filter.labels" . | nindent 4 }}
    {{- with .Values.dashboardConfigMap.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.dashboardConfigMap.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  hickory-filter.json: |
    {{- include "hickory-filter.dashboard" . | nindent 4 }}
{{- end }}
