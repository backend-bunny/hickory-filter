{{- if .Values.grafanaDashboard.enabled }}
{{- if not .Values.grafanaDashboard.instanceSelector }}
{{- fail "grafanaDashboard.instanceSelector is required when grafanaDashboard is enabled" }}
{{- end }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: {{ include "hickory-filter.fullname" . }}
  labels:
    {{- include "hickory-filter.labels" . | nindent 4 }}
    {{- with .Values.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  instanceSelector:
    {{- toYaml .Values.grafanaDashboard.instanceSelector | nindent 4 }}
  {{- with .Values.grafanaDashboard.folder }}
  folder: {{ . | quote }}
  {{- end }}
  {{- with .Values.grafanaDashboard.resyncPeriod }}
  resyncPeriod: {{ . | quote }}
  {{- end }}
  {{- if .Values.grafanaDashboard.allowCrossNamespaceImport }}
  allowCrossNamespaceImport: true
  {{- end }}
  json: |
    {{- include "hickory-filter.dashboard" . | nindent 4 }}
{{- end }}
