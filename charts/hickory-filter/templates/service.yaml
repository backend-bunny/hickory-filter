{{- $port := include "hickory-filter.httpPort" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hickory-filter.fullname" . }}
  labels:
    {{- include "hickory-filter.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "hickory-filter.selectorLabels" . | nindent 4 }}
  ports:
    - name: dns-udp
      port: {{ .Values.service.port }}
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: {{ .Values.service.port }}
      targetPort: dns-tcp
      protocol: TCP
    {{- if $port }}
    - name: http
      port: {{ $port }}
      targetPort: http
      protocol: TCP
    {{- end }}
