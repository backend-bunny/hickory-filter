apiVersion: v1
kind: ConfigMap
metadata:
  name: rel-hickory-filter-dashboard
  namespace: ns
  labels:
    helm.sh/chart: hickory-filter-VERSION
    app.kubernetes.io/name: hickory-filter
    app.kubernetes.io/instance: rel
    app.kubernetes.io/version: "VERSION"
    app.kubernetes.io/managed-by: Helm
    grafana_dashboard: "1"
data:
  hickory-filter.json: |
    {
      "uid": "hickory-filter",
      "title": "hickory-filter",
      "description": "Queries, blocking, upstreams, lists and, from the query log, the busiest clients and names.",
      "tags": [
        "dns",
        "hickory-filter"
      ],
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "graphTooltip": 1,
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "timepicker": {},
      "annotations": {
        "list": []
      },
      "links": [],
      "templating": {
        "list": [
          {
            "name": "ds_prometheus",
            "label": "Metrics",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0,
            "refresh": 1,
            "regex": "",
            "options": [],
            "multi": false,
            "includeAll": false
          },
          {
            "name": "ds_loki",
            "label": "Logs",
            "type": "datasource",
            "query": "loki",
            "current": {},
            "hide": 0,
            "refresh": 1,
            "regex": "",
            "options": [],
            "multi": false,
            "includeAll": false
          },
          {
            "name": "instance",
            "label": "Instance",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${ds_prometheus}"
            },
            "query": {
              "query": "label_values(hickory_filter_queries_total, instance)",
              "refId": "instance"
            },
            "definition": "label_values(hickory_filter_queries_total, instance)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": "All",
              "value": "$__all"
            },
            "hide": 0,
            "sort": 1,
            "regex": "",
            "options": []
          },
          {
            "name": "log_selector",
            "label": "Log stream selector",
            "type": "textbox",
            "query": "{app_kubernetes_io_name=\"hickory-filter\"}",
            "current": {
              "selected": false,
              "text": "{app_kubernetes_io_name=\"hickory-filter\"}",
              "value": "{app_kubernetes_io_name=\"hickory-filter\"}"
            },
            "hide": 0,
            "options": [
              {
                "selected": true,
                "text": "{app_kubernetes_io_name=\"hickory-filter\"}",
                "value": "{app_kubernetes_io_name=\"hickory-filter\"}"
              }
            ]
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Overview",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Queries",
          "description": "Queries answered over the selected time range.",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prometheus}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "sum(increase(hickory_filter_queries_total{instance=~\"$instance\"}[$__range]))",
              "refId": "A",
              "legendFormat": "",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Blocked",
          "description": "Share of queries answered with a blocked response.",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prometheus}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "100 * sum(increase(hickory_filter_queries_total{outcome=\"blocked\",instance=~\"$instance\"}[$__range])) / sum(increase(hickory_filter_queries_total{instance=~\"$instance\"}[$__range]))",
              "refId": "A",
              "legendFormat": "",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Rules loaded",
          "description": "Rules in the live rule set, allow and block.",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prometheus}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "max(sum by (instance) (hickory_filter_rules{instance=~\"$instance\"}))",
              "refId": "A",
              "legendFormat": "",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto"
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Rule set age",
          "description": "Time since the rule set was last replaced (the first rule set at startup counts).",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prometheus}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "time() - max(hickory_filter_ruleset_last_swap_timestamp_seconds{instance=~\"$instance\"})",
              "refId": "A",
              "legendFormat": "",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto"
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Queries per second by outcome",
          "description": "allowed: an allow rule matched. blocked. passed: no rule matched. upstream_error: no upstream answered.",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prometheus}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 5
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "sum by (outcome) (rate(hickory_filter_queries_total{instance=~\"$instance\"}[$__rate_interval]))",
              "refId": "A",
              "legendFormat": "{{outcome}}",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                },
                "fillOpacity": 30
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Answer time",
          "description": "Time taken to answer a query, as quantiles of the histogram over all outcomes.",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prometheus}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 5
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "histogram_quantile(0.5, sum by (le) (rate(hickory_filter_query_duration_seconds_bucket{instance=~\"$instance\"}[$__rate_interval])))",
              "refId": "A",
              "legendFormat": "p50",
              "range": true
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "histogram_quantile(0.9, sum by (le) (rate(hickory_filter_query_duration_seconds_bucket{instance=~\"$instance\"}[$__rate_interval])))",
              "refId": "B",
              "legendFormat": "p90",
              "range": true
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "histogram_quantile(0.99, sum by (le) (rate(hickory_filter_query_duration_seconds_bucket{instance=~\"$instance\"}[$__rate_interval])))",
              "refId": "C",
              "legendFormat": "p99",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 8,
          "type": "bargauge",
          "title": "Queries by type",
          "description": "Over the selected time range. Types outside a fixed common set are counted as other.",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prometheus}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 13
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "sum by (type) (increase(hickory_filter_queries_total{instance=~\"$instance\"}[$__range]))",
              "refId": "A",
              "legendFormat": "{{type}}",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true
          }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Upstream queries by protocol",
          "description": "Queries sent to the upstream resolvers.",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prometheus}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 13
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "sum by (protocol) (rate(hickory_resolver_outgoing_queries_total{instance=~\"$instance\"}[$__rate_interval]))",
              "refId": "A",
              "legendFormat": "{{protocol}}",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Upstream responses by status",
          "description": "Success, timeout and failure responses, aggregated over the upstreams.",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prometheus}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 13
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "sum by (status) (rate(hickory_resolver_name_server_query_responses_total{instance=~\"$instance\"}[$__rate_interval]))",
              "refId": "A",
              "legendFormat": "{{status}}",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 11,
          "type": "stat",
          "title": "Cache hit ratio",
          "description": "Share of forwarded queries answered from the response cache.",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prometheus}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 21
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "sum(increase(hickory_resolver_cache_hit_total{instance=~\"$instance\"}[$__range])) / (sum(increase(hickory_resolver_cache_hit_total{instance=~\"$instance\"}[$__range])) + sum(increase(hickory_resolver_cache_miss_total{instance=~\"$instance\"}[$__range])))",
              "refId": "A",
              "legendFormat": "",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto"
          }
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Rules by action and kind",
          "description": "Rules in the live rule set.",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prometheus}"
          },
          "gridPos": {
            "h": 8,
            "w": 18,
            "x": 6,
            "y": 21
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "max by (action, kind) (hickory_filter_rules{instance=~\"$instance\"})",
              "refId": "A",
              "legendFormat": "{{action}} {{kind}}",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 13,
          "type": "table",
          "title": "Lists",
          "description": "Each list's rules, skipped lines, time since its last successful load, and whether its last refresh worked. A failed refresh keeps the last good rules.",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prometheus}"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 29
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "max by (action, type, url) (hickory_filter_list_rules{instance=~\"$instance\"})",
              "refId": "A",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "max by (action, type, url) (hickory_filter_list_skipped_lines{instance=~\"$instance\"})",
              "refId": "B",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "time() - max by (action, type, url) (hickory_filter_list_last_success_timestamp_seconds{instance=~\"$instance\"})",
              "refId": "C",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "min by (action, type, url) (hickory_filter_list_last_refresh_success{instance=~\"$instance\"})",
              "refId": "D",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Last success"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Last refresh"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "0": {
                            "text": "failed",
                            "color": "red",
                            "index": 0
                          },
                          "1": {
                            "text": "ok",
                            "color": "green",
                            "index": 1
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm"
          },
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "url": "List",
                  "action": "Action",
                  "type": "Type",
                  "Value #A": "Rules",
                  "Value #B": "Skipped lines",
                  "Value #C": "Last success",
                  "Value #D": "Last refresh"
                }
              }
            }
          ]
        },
        {
          "id": 14,
          "type": "row",
          "title": "Usage (needs the query log)",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 37
          },
          "panels": []
        },
        {
          "id": 15,
          "type": "text",
          "title": "About these panels",
          "description": "",
          "gridPos": {
            "h": 3,
            "w": 24,
            "x": 0,
            "y": 38
          },
          "targets": [],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "mode": "markdown",
            "content": "These panels read the **query log** from Loki. They stay empty unless the server runs with `log.query_log = true` (and `format = \"json\"`) and its logs are collected into Loki. Set the **Log stream selector** variable to the labels that identify hickory-filter's log lines."
          }
        },
        {
          "id": 16,
