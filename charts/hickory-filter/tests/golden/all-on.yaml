# Source: hickory-filter/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rel-hickory-filter
  labels:
    helm.sh/chart: hickory-filter-VERSION
    app.kubernetes.io/name: hickory-filter
    app.kubernetes.io/instance: rel
    app.kubernetes.io/version: "VERSION"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hickory-filter
      app.kubernetes.io/instance: rel
  template:
    metadata:
      annotations:
        checksum/config: 0aec84d864e75a83311ce74a5e273e2914cced7945d519061592d2e141853da6
        example.com/note: x
      labels:
        helm.sh/chart: hickory-filter-VERSION
        app.kubernetes.io/name: hickory-filter
        app.kubernetes.io/instance: rel
        app.kubernetes.io/version: "VERSION"
        app.kubernetes.io/managed-by: Helm
        team: dns
    spec:
      serviceAccountName: rel-hickory-filter
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hickory-filter
          image: "ghcr.io/backend-bunny/hickory-filter:VERSION"
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/hickory-filter/config.toml"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: dns-udp
              containerPort: 1053
              protocol: UDP
            - name: dns-tcp
              containerPort: 1053
              protocol: TCP
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          volumeMounts:
            - name: config
              mountPath: /etc/hickory-filter
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/hickory-filter
      volumes:
        - name: config
          configMap:
            name: rel-hickory-filter
            items:
              - key: config.toml
                path: config.toml
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir:
            sizeLimit: 64Mi

