# Source: hickory-filter/templates/podmonitor.yaml
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: rel-hickory-filter
  labels:
    helm.sh/chart: hickory-filter-VERSION
    app.kubernetes.io/name: hickory-filter
    app.kubernetes.io/instance: rel
    app.kubernetes.io/version: "VERSION"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: hickory-filter
      app.kubernetes.io/instance: rel
  namespaceSelector:
    matchNames: [ns]
  podMetricsEndpoints:
    - port: http
      path: /metrics
      scrapeTimeout: 10s

