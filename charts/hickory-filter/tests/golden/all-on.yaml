# Source: hickory-filter/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: rel-hickory-filter
  labels:
    helm.sh/chart: hickory-filter-VERSION
    app.kubernetes.io/name: hickory-filter
    app.kubernetes.io/instance: rel
    app.kubernetes.io/version: "VERSION"
    app.kubernetes.io/managed-by: Helm
data:
  config.toml: |
    http = "0.0.0.0:8080"
    upstreams = ["1.1.1.1", "9.9.9.9"]
    
    [filter]
      cache_dir = "/var/cache/hickory-filter"
      rules = ["block wildcard *.ads.example", "allow domain ok.ads.example"]
    
      [[filter.lists]]
        refresh = "6h"
        rule = "block list hosts https://lists.example/hosts.txt"
    
    [log]
      format = "json"
    

