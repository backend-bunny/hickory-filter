            "h": 8,
            "w": 18,
            "x": 6,
            "y": 21
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "max by (action, kind) (hickory_filter_rules{instance=~\"$instance\"})",
              "refId": "A",
              "legendFormat": "{{action}} {{kind}}",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 13,
          "type": "table",
          "title": "Lists",
          "description": "Each list's rules, skipped lines, time since its last successful load, and whether its last refresh worked. A failed refresh keeps the last good rules.",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prometheus}"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 29
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "max by (action, type, url) (hickory_filter_list_rules{instance=~\"$instance\"})",
              "refId": "A",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "max by (action, type, url) (hickory_filter_list_skipped_lines{instance=~\"$instance\"})",
              "refId": "B",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "time() - max by (action, type, url) (hickory_filter_list_last_success_timestamp_seconds{instance=~\"$instance\"})",
              "refId": "C",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "min by (action, type, url) (hickory_filter_list_last_refresh_success{instance=~\"$instance\"})",
              "refId": "D",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Last success"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Last refresh"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "0": {
                            "text": "failed",
                            "color": "red",
                            "index": 0
                          },
                          "1": {
                            "text": "ok",
                            "color": "green",
                            "index": 1
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm"
          },
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "url": "List",
                  "action": "Action",
                  "type": "Type",
                  "Value #A": "Rules",
                  "Value #B": "Skipped lines",
                  "Value #C": "Last success",
                  "Value #D": "Last refresh"
                }
              }
            }
          ]
        },
        {
          "id": 14,
          "type": "row",
          "title": "Usage (needs the query log)",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 37
          },
          "panels": []
        },
        {
          "id": 15,
          "type": "text",
          "title": "About these panels",
          "description": "",
          "gridPos": {
            "h": 3,
            "w": 24,
            "x": 0,
            "y": 38
          },
          "targets": [],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "mode": "markdown",
            "content": "These panels read the **query log** from Loki. They stay empty unless the server runs with `log.query_log = true` (and `format = \"json\"`) and its logs are collected into Loki. Set the **Log stream selector** variable to the labels that identify hickory-filter's log lines."
          }
        },
        {
          "id": 16,
          "type": "bargauge",
          "title": "Top blocked names",
          "description": "The most requested names that were blocked, over the selected time range.",
          "datasource": {
            "type": "loki",
            "uid": "${ds_loki}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 41
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${ds_loki}"
              },
              "expr": "topk(10, sum by (name) (count_over_time(${log_selector} | json | target=\"hickory_filter::query\" | outcome=\"blocked\" [$__range])))",
              "refId": "A",
              "legendFormat": "{{name}}",
              "queryType": "instant"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true
          }
        },
        {
          "id": 17,
          "type": "bargauge",
          "title": "Top permitted names",
          "description": "The most requested names that were forwarded.",
          "datasource": {
            "type": "loki",
            "uid": "${ds_loki}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 41
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${ds_loki}"
              },
              "expr": "topk(10, sum by (name) (count_over_time(${log_selector} | json | target=\"hickory_filter::query\" | outcome=~\"allowed|passed\" [$__range])))",
              "refId": "A",
              "legendFormat": "{{name}}",
              "queryType": "instant"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true
          }
        },
        {
          "id": 18,
          "type": "bargauge",
          "title": "Top clients",
          "description": "The clients that sent the most queries.",
          "datasource": {
            "type": "loki",
            "uid": "${ds_loki}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 41
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${ds_loki}"
              },
              "expr": "topk(10, sum by (client) (count_over_time(${log_selector} | json | target=\"hickory_filter::query\" [$__range])))",
              "refId": "A",
              "legendFormat": "{{client}}",
              "queryType": "instant"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true
          }
        },
        {
          "id": 19,
          "type": "timeseries",
          "title": "Queries per client",
          "description": "Query rate of the five busiest clients.",
          "datasource": {
            "type": "loki",
            "uid": "${ds_loki}"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 49
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${ds_loki}"
              },
              "expr": "topk(5, sum by (client) (rate(${log_selector} | json | target=\"hickory_filter::query\" [$__auto])))",
              "refId": "A",
              "legendFormat": "{{client}}",
              "queryType": "range"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        }
      ]
    }
    

