# Example hickory-filter configuration. Every key shown here is optional
# except `upstreams`. Check a file without serving: hickory-filter --check --config <file>
#
# Resolver syntax (upstreams and bootstrap): an IP address, never a host name.
#   192.0.2.53                      plain DNS, port 53
#   dns://192.0.2.53:5353           plain DNS, explicit port
#   tls://192.0.2.53#dns.example    DNS-over-TLS, port 853, certificate verified
#                                   for the name after '#'
#   [2001:db8::53]:53               IPv6 with a port

# DNS listen addresses, answered over UDP and TCP. Default: port 1053 on all
# addresses, so the server runs unprivileged.
listen = ["0.0.0.0:1053", "[::]:1053"]

# How queries that are not blocked are answered. "forward" (the default) asks
# the upstreams below. "recursive" resolves them from the root servers, asks no
# third-party resolver, and takes no upstreams: see [recursion] at the end.
mode = "forward"

# Where queries that are not blocked are forwarded. At least one is required in
# forward mode; recursive mode takes none.
upstreams = ["tls://192.0.2.53#dns.example", "192.0.2.54"]

# The most forwarded answers kept in the response cache (each for at most its
# TTL). 0 disables the cache. Rule changes apply to cached names at once,
# because filtering happens before the cache.
cache_size = 4096

# Metrics, health and readiness. An address, or false to disable.
http = "0.0.0.0:8080"

[log]
# Logs go to stderr. level: error, warn, info (the default), debug or trace.
# format: text (the default) or json, one object per line.
level = "info"
format = "text"
# One line per answered query, off by default (queries are then logged only at
# debug level). A log collector can turn these lines into per-client and
# per-name views. In JSON the fields client, name, type, outcome, rcode and
# duration_ms are top-level members, and the line's target is
# "hickory_filter::query".
query_log = false
# How the client appears in query lines: address (the default), masked (the
# last octet of an IPv4 address zeroed, an IPv6 address cut to its first 48
# bits) or omit (no client field).
query_log_client = "address"

[filter]
# How often lists are reloaded. Units such as "6h" or "90m"; 0 disables.
refresh = "24h"

# Resolver used for list host names. Without it the system resolver is used.
# Never this server itself.
bootstrap = "tls://192.0.2.53#dns.example"

# Optional on-disk copy of the last good list contents (must be writable).
# cache_dir = "/var/cache/hickory-filter"

# Inline rules, one per line: <block|allow> <domain|wildcard|regex> <value>.
# Allow always wins over block.
rules = [
  "block wildcard *.ads.example",
  "allow domain ok.ads.example",
]

# What a blocked query is answered with. mode is one of null (the default),
# address, nodata or nxdomain. ttl is in seconds.
[filter.response]
mode = "null"
ttl = 3600
# mode = "address" also takes ipv4 and/or ipv6:
# ipv4 = "192.0.2.1"
# ipv6 = "2001:db8::1"

# Remote and local lists: <block|allow> list <domain|hosts|wildcard|regex> <url>.
[[filter.lists]]
rule = "block list hosts https://lists.example/hosts.txt"
refresh = "6h"      # overrides filter.refresh for this list
required = false    # true: startup fails if this list cannot be loaded

# Recursive mode: set mode = "recursive", remove `upstreams`, and tune it here
# if you need to. Every key is optional. Plain DNS goes to the authoritative
# servers on port 53 (and TLS probes to port 853), so the network must allow it.
# [recursion]
# File of root server hints the resolution starts from.
# roots = "/usr/share/hickory-filter/root.hints"
# DNSSEC: "validate" (built-in root trust anchor), "off", or the path of a file
# of trust anchors to use instead.
# dnssec = "validate"
# How much of a query name each name server sees: "strict" or "relaxed".
# qname_minimization = "strict"
# Use TLS to name servers that accept it. Unauthenticated: it protects against
# passive observation only, and only for servers that accept TLS.
# opportunistic_encryption = true
# Keep what was learned about TLS support across restarts (a writable path).
# state_file = "/var/lib/hickory-filter/tls.toml"
# How often that state is saved: a restart loses at most this much learning.
# state_save_interval = "10m"
